spring.application.name=api-gateway
logging.level.org.springframework.security=DEBUG

server.port=9000

#services
services.product.url=http://localhost:8084
services.order.url=http://localhost:8085
services.inventory.url=http://localhost:8083

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8059/realms/spring-microservices-security-realm

#localhost:8084/swagger-ui
springdoc.swagger-ui.path=/swagger-ui
#localhost:8084/api-docs
springdoc.api-docs.path=/api-docs