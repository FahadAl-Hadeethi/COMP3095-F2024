spring.application.name=order-service
server.port=8085
#change the port if there's something wrong

#postgres local config
spring.datasource.url=jdbc:postgresql://postgres-order:5432/order-service

#postgres config
spring.datasource.username=admin
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=none

inventory.service.url=http://inventory-service:8083

#localhost:8085/swagger-ui
springdoc.swagger-ui.path=/swagger-ui
#localhost:8085/api-docs
springdoc.api-docs.path=/api-docs